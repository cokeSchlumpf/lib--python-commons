[project]
name = "commons"
version = "0.1.1"
description = "This library contains common functionalities which are used across a broad range of apps and other libs."
authors = [
    {name = "Michael Wellner",email = "michael.wellner@googlemail.com"}
]
readme = "README.md"
requires-python = ">=3.12, <4.0"

[tool.poetry]
packages = [
   { include = "commons", from = "src" },
   { include = "jobs", from = "src" }
]

[tool.poetry.dependencies]
azure-storage-blob = { version = "^12.28.0", optional = true }
azure-identity = { version = "^1.25.3", optional = true }
bcrypt = "^4.3.0"
pandas = "^2.3.3"
pyodbc = "^5.3.0"
sqlalchemy = "^2.0.45"
sqlmodel = "^0.0.31"
xlsxwriter = "^3.2.9"

[tool.poetry.extras]
azure = ["azure-storage-blob", "azure-identity"]

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
mypy = "^1.18.1"
pandas-stubs = "^2.3.3.251201"
poethepoet = "^0.37.0"
pytest = "^8.4.2"
pytest-cov = "^7.0.0"
pytest-dotenv = "^0.5.2"
ruff = "^0.13.0"
sqlalchemy = {extras = ["mypy"], version = "^2.0.46"}

[tool.poetry.group.docs.dependencies]
mkdocs-material = "^9.7.7"
mkdocstrings = {extras = ["python"], version = "^1.0.6"}

[tool.poetry.group.release.dependencies]
openai = "^3.19.2"

[tool.poe.tasks]
check = [
    { cmd = "ruff check src/commons"},
    { cmd = "ruff format --check src/commons"},
    { cmd = "mypy src/commons"},
    { cmd = "ruff check src/jobs"},
    { cmd = "ruff format --check src/jobs"},
    { cmd = "mypy src/jobs"},
    { cmd = "ruff check scripts"},
    { cmd = "ruff format --check scripts"},
    { cmd = "mypy scripts"},
    { cmd = "pytest" }
]
docs = { cmd = "mkdocs serve", help = "Serve the documentation locally" }
docs-build = { cmd = "mkdocs build --strict", help = "Build the documentation into site/" }
fix = [
    { cmd = "ruff check src/commons --fix" },
    { cmd = "ruff format src/commons" },
    { cmd = "ruff check src/jobs --fix" },
    { cmd = "ruff format src/jobs" },
    { cmd = "ruff check scripts --fix" },
    { cmd = "ruff format scripts" },
]

[tool.pytest.ini_options]
addopts = "--import-mode=prepend"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[app]
foo = "bar"

[app.documents.vectorstore]
mode = "chroma"

[app.documents.vectorstore.chroma]
directory = "/foo/bar/lorem"
