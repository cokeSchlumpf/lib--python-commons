    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: cokeSchlumpf/core--devops-workflows/.github/workflows/python-release.yml@versions/1
    secrets: inherit
