name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      # Creates/updates the Release PR, or creates tag and GitHub Release once the Release PR is merged.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Moves versions/<major> to the new release. No force push: a non-fast-forward fails loudly.
      - if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update major version branch
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          SHA: ${{ steps.release.outputs.sha }}
          MAJOR: ${{ steps.release.outputs.major }}
        run: git push origin "${SHA}:refs/heads/versions/${MAJOR}"

      # Optional: polish the release notes of the Release PR with an LLM. Never blocks a release.
      - if: ${{ steps.release.outputs.prs_created == 'true' && env.OPENAI_API_KEY != '' }}
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - if: ${{ steps.release.outputs.prs_created == 'true' && env.OPENAI_API_KEY != '' }}
        continue-on-error: true
        name: Install Poetry
        run: pipx install poetry==2.1.3

      - if: ${{ steps.release.outputs.prs_created == 'true' && env.OPENAI_API_KEY != '' }}
        continue-on-error: true
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: poetry

      - name: Polish release notes
        if: ${{ steps.release.outputs.prs_created == 'true' && env.OPENAI_API_KEY != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP__MODELS__OPENAI__API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_NUMBER: ${{ fromJSON(steps.release.outputs.pr).number }}
        run: |
          poetry install --only main,release
          gh pr view "$PR_NUMBER" --json body --jq .body > "$RUNNER_TEMP/body.md"
          poetry run python scripts/polish_changelog.py --body "$RUNNER_TEMP/body.md" --changelog CHANGELOG.md

          if git diff --quiet -- CHANGELOG.md; then
            echo "Release notes unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: polish release notes" -- CHANGELOG.md
          git push
          gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/body.md"
