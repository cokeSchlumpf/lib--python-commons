site_name: Commons
site_description: Common functionalities which are used across a broad range of apps and other libs.
site_url: https://cokeschlumpf.github.io/lib--python-commons/
repo_url: https://github.com/cokeSchlumpf/lib--python-commons
repo_name: cokeSchlumpf/lib--python-commons
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: true
            show_source: true
            show_if_no_docstring: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            summary: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - API reference:
      - General:
          - Collection operators: api/collection-operators.md
          - Date & time operators: api/datetime-operators.md
          - Dict operators: api/dict-operators.md
          - String operators: api/string-operators.md
          - URL operators: api/url-operators.md
          - Path operators: api/path-operators.md
          - Excel operators: api/excel-operators.md
          - Tree: api/tree.md
      - Settings: api/settings.md
      - Database:
          - Database: api/database.md
          - Database operators: api/database-operators.md
      - Storage:
          - Storage: api/storage.md
          - Storage operators: api/storage-operators.md
      - Users: api/users.md
      - Jobs: api/jobs.md
  - Changelog: changelog.md
